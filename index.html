    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .button-link {
            display: inline-block;
            padding: 18px 42px;
            border: 2px solid #fff;
            border-radius: 12px;
            color: #fff;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
            transition: all 0.2s ease;
        }
        
        .button-link:hover {
            background: #fff;
            color: #000;
        }
    </style>
</head>
